<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #333;
            padding: 10px 20px;
            display: flex;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-weight: 500;
        }

        .navbar a:hover {
            color: #ddd;
        }

        .navbar .brand {
            font-size: 1.2rem;
            font-weight: bold;
            margin-right: auto;
        }

        .navbar .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar .icon-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            text-decoration: none;
            font-size: 1rem;
        }

        .navbar .icon-link:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .navbar .register-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            border-radius: 24px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid transparent;
        }

        .navbar .register-button:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }

        .container {
            padding: 20px;
        }

        form {
            max-width: 420px;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            display: inline-block;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div class="navbar">
        <div class="brand">E-Learning</div>
        <a href="/">Home</a>
        <a href="#about">About</a>
        <a href="#courses">Courses</a>
        <a href="#liveclasses">Live Classes</a>
        <a href="#articles">Articles</a>
        <div class="actions">
            <a href="#search" class="icon-link" title="Search">🔍</a>
            <a href="#signin" class="icon-link" title="Sign In">👤</a>
            <a href="{% url 'register' %}" class="register-button">Register</a>
        </div>
    </div>
    <div class="container">
        <h1>Register</h1>
        {% if error %}
        <p style="color:red">{{ error }}</p>
        {% endif %}
        {% if success %}
        <p style="color:green">{{ success }}</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div>
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" required>
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="phone">Mobile No.</label>
                <input type="text" id="phone" name="phone" required>
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Register</button>
        </form>
</body>

</html>
